spring.application.name=backend

spring.data.redis.url=redis://localhost:6379
spring.session.data.redis.namespace=raretable:test:session
spring.session.timeout=30m

raretable.auth.siwe.domain=localhost:5173
raretable.auth.siwe.uri=http://localhost:5173
raretable.auth.siwe.challenge-ttl=PT5M
raretable.auth.siwe.chain-id=1
raretable.auth.siwe.allow-insecure-origin=true
raretable.auth.rate-limit.window=PT1M
raretable.auth.rate-limit.challenge.requests-per-source=1000
raretable.auth.rate-limit.challenge.requests-per-wallet=1000
raretable.auth.rate-limit.challenge.requests-global=1000
raretable.auth.rate-limit.verification.requests-per-source=1000
raretable.auth.rate-limit.verification.requests-per-wallet=1000
raretable.auth.rate-limit.verification.requests-global=1000

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
