spring.application.name=backend

raretable.auth.siwe.domain=localhost:5173
raretable.auth.siwe.uri=http://localhost:5173
raretable.auth.siwe.challenge-ttl=PT5M
raretable.auth.siwe.chain-id=1
raretable.auth.siwe.allow-insecure-origin=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
