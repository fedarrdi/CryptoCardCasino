spring.application.name=backend

spring.datasource.url=${RARETABLE_DATABASE_URL}
spring.datasource.username=${RARETABLE_DATABASE_USERNAME}
spring.datasource.password=${RARETABLE_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.url=${RARETABLE_REDIS_URL}
spring.data.redis.repositories.enabled=false
spring.session.data.redis.configure-action=none
spring.session.data.redis.namespace=raretable:session
spring.session.data.redis.repository-type=default
spring.session.timeout=30m

raretable.auth.siwe.domain=${RARETABLE_AUTH_DOMAIN}
raretable.auth.siwe.uri=${RARETABLE_AUTH_URI}
raretable.auth.siwe.challenge-ttl=PT5M
raretable.auth.siwe.chain-id=${RARETABLE_AUTH_CHAIN_ID:1}
raretable.auth.siwe.allow-insecure-origin=false
raretable.auth.rate-limit.window=PT1M
raretable.auth.rate-limit.challenge.requests-per-source=10
raretable.auth.rate-limit.challenge.requests-per-wallet=5
raretable.auth.rate-limit.challenge.requests-global=1000
raretable.auth.rate-limit.verification.requests-per-source=20
raretable.auth.rate-limit.verification.requests-per-wallet=5
raretable.auth.rate-limit.verification.requests-global=1000
raretable.auth.session.absolute-timeout=PT8H

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
