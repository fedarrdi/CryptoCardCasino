spring.application.name=backend

spring.datasource.url=${RARETABLE_DATABASE_URL}
spring.datasource.username=${RARETABLE_DATABASE_USERNAME}
spring.datasource.password=${RARETABLE_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

raretable.auth.siwe.domain=${RARETABLE_AUTH_DOMAIN}
raretable.auth.siwe.uri=${RARETABLE_AUTH_URI}
raretable.auth.siwe.challenge-ttl=PT5M
raretable.auth.siwe.chain-id=${RARETABLE_AUTH_CHAIN_ID:1}
raretable.auth.siwe.allow-insecure-origin=false
raretable.auth.session.absolute-timeout=PT8H

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
